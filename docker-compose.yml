services:
  postgres:
    image: postgres:16
    container_name: delightsboutique-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: delightsboutique_dev
      POSTGRES_USER: delightsboutique_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delightsboutique_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: src/DelightsBoutique.Api/Dockerfile
    container_name: delightsboutique-api
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=delightsboutique_dev;Username=delightsboutique_app;Password=${POSTGRES_PASSWORD:-delightsboutique_dev_password}"
    ports:
      - "8080:8080"

volumes:
  postgres-data:
